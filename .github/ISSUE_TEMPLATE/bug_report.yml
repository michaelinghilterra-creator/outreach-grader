name: Bug Report
description: Report a bug in Outreach Grader
labels: ["bug"]
body:
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/michaelinghilterra-creator/outreach-grader/blob/master/CODE_OF_CONDUCT.md)
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include the message you graded if relevant (redact anything sensitive).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "e.g., macOS 15 / Node 20.11"
  - type: textarea
    id: console
    attributes:
      label: Browser console / server output
      description: Paste any errors from the browser console or the terminal running `npm start`
      render: shell
